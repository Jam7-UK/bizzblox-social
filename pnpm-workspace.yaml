packages:
  - apps/*
  - libraries/*

ignoreWorkspaceRootCheck: true
injectWorkspacePackages: true
nodeLinker: hoisted
onlyBuiltDependencies:
  - bcrypt
overrides:
  '@types/react': 19.1.8
  '@types/react-dom': 19.1.6
  multer: ^2.2.0
  next: 16.3.1
  react: 19.2.4
  react-dom: 19.2.4
syncInjectedDepsAfterScripts:
  - build
